<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10B981">
    <title>Sainom Kaset - Main Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #F1F5F9; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        .portal-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .portal-btn:active {
            transform: scale(0.96);
        }

        .portal-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .portal-btn:active::after {
            opacity: 1;
        }

        /* Glass background for aesthetic */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Decorative background blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-emerald-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-72 h-72 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>

    <div class="w-full max-w-sm z-10">
        <!-- Header -->
        <div class="text-center mb-8 animate-fade-in-down">
            <div class="w-24 h-24 mx-auto bg-white rounded-2xl shadow-sm p-2 mb-4">
                <img src="logo.jpg" alt="Logo" class="w-full h-full object-cover rounded-xl border border-gray-100">
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Sainom Kaset</h1>
            <p class="text-gray-500 mt-1 text-sm">ระบบจัดการข้อมูลพนักงานและร้าน</p>
        </div>

        <!-- Menu Grid -->
        <div class="flex flex-col gap-4">
            <!-- Checklist Button -->
            <a href="checklist.html" class="portal-btn glass-panel block w-full p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-emerald-500">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800">Checklist</h2>
                        <p class="text-xs text-gray-500 mt-0.5">บันทึกภาระงาน เปิด-ปิดร้าน</p>
                    </div>
                </div>
                <div class="text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                </div>
            </a>

            <!-- Stock Count Button -->
            <a href="stock.html" class="portal-btn glass-panel block w-full p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-blue-500 mt-2">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800">นับสต๊อก (Stock)</h2>
                        <p class="text-xs text-gray-500 mt-0.5">ระบบเช็คสต๊อกสินค้า</p>
                    </div>
                </div>
                <div class="text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                </div>
            </a>
        </div>
        
        <div class="mt-12 text-center">
             <p class="text-xs text-gray-400">© 2026 Sainom Kaset Portal</p>
        </div>
    </div>
</body>
</html>
