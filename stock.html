            transition: all 0.2s !important;

        button.swal2-confirm:active, button.swal2-cancel:active {

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwyzwcabtJFW7n8f8juM-XLMRdnQlV5y6vZRQLXFUxLXT_ABRHmGBQo5vz-zinuNGw/exec';
        let stockSettings = [];
        let selectedRound = '';
        let selectedStation = '';
        let counterName = '';
        let currentItems = [];
        
        // Draft storage (resets at 3 AM)
        const nowForDraft = new Date();
        if (nowForDraft.getHours() < 3) {
            nowForDraft.setDate(nowForDraft.getDate() - 1);
        }
        const todayStr = nowForDraft.toLocaleDateString('en-CA'); // YYYY-MM-DD
        let savedDrafts = JSON.parse(localStorage.getItem('stock_drafts_' + todayStr)) || {};

        document.addEventListener('DOMContentLoaded', () => {
            fetchStockSettings();
            updateStationButtons();
            highlightTodayRounds();
        });

        function highlightTodayRounds() {
            const today = new Date().getDay(); // 0: Sun, 1: Mon, ...
            let activeRounds = [];
            
            // Sainom: Sunday (0), Tuesday (2)
            if (today === 0 || today === 2) activeRounds.push('Sainom');
            // Makro: Monday (1), Thursday (4), Friday (5)
            if (today === 1 || today === 4 || today === 5) activeRounds.push('Makro');
            // ร้านอื่นๆ: Wednesday (3), Saturday (6)
            if (today === 3 || today === 6) activeRounds.push('อื่นๆ');

            ['Sainom', 'Makro', 'อื่นๆ'].forEach(round => {
                const btn = document.getElementById(`btn-round-${round}`);
                const badge = document.getElementById(`badge-today-${round}`);
                if (!btn || !badge) return;

                if (activeRounds.includes(round)) {
                    badge.classList.remove('hidden');
                    btn.classList.add('ring-2', 'ring-offset-2', 'border-transparent');
                    
                    if (round === 'Sainom') btn.classList.add('ring-sky-400', 'bg-sky-50/50');
                    if (round === 'Makro') btn.classList.add('ring-emerald-400', 'bg-emerald-50/50');
                    if (round === 'อื่นๆ') btn.classList.add('ring-rose-400', 'bg-rose-50/50');
                } else {
                    btn.classList.add('opacity-70', 'grayscale-[0.3]');
                }
            });
        }

        function updateStationButtons() {
            if (!selectedRound) return;
            ['Service', 'Bingsu', 'Bread', 'Drink', 'Hotmeal'].forEach(st => {
                const badge = document.getElementById(`badge-${st}`);
                const btn = document.getElementById(`btn-station-${st}`);
                const draftKey = selectedRound + '_' + st;
                if (badge && btn) {
                    if (savedDrafts[draftKey]) {
                        badge.classList.remove('hidden');
                        btn.classList.add('border-emerald-300', 'bg-emerald-50/50');
                    } else {
                        badge.classList.add('hidden');
                        btn.classList.remove('border-emerald-300', 'bg-emerald-50/50');

                }
            });

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('opacity-100');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function fetchStockSettings() {
            const cached = localStorage.getItem('cachedStockSettings');
            if (cached) {
                stockSettings = JSON.parse(cached);
                // Fetch in background silently
                fetch(WEB_APP_URL + "?action=getStockSettings")
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === "success") {
                            stockSettings = res.data;
                            localStorage.setItem('cachedStockSettings', JSON.stringify(res.data));
                        }
                    }).catch(e => console.error("Background fetch failed", e));
            } else {
                showLoading("กำลังโหลดข้อมูลสินค้า...");
                fetch(WEB_APP_URL + "?action=getStockSettings")
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === "success") {
                            stockSettings = res.data;
                            localStorage.setItem('cachedStockSettings', JSON.stringify(res.data));
                            hideLoading();
                        } else {
                            throw new Error(res.message || "Unknown error");
                        }
                    })
                    .catch(err => {
                        hideLoading();
                        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลสินค้าได้: ' + err.message, 'error');
                    });
            }
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            currentItems = stockSettings.reduce((acc, item) => {
                if (item.station !== selectedStation) return acc;
                
                let include = false;
                let displayPar = 0;
                
                if (selectedRound === 'เปิดร้าน' || selectedRound === 'รอบเย็น') {
                    if (item.dailyMode === 'Daily') {
                        include = true;
                        displayPar = item.parDay;
                    }
                } else if (selectedRound === 'Sainom') {
                    if (item.supplierMode && item.supplierMode.includes('Sainom')) {
                        include = true;
                        displayPar = item.parRnd;
                    }
                } else if (selectedRound === 'Makro') {
                    if (item.supplierMode && item.supplierMode.includes('Makro')) {
                        include = true;
                        displayPar = item.parRnd;
                    }
                } else if (selectedRound === 'ร้านอื่นๆ') {
                    if (item.supplierMode && item.supplierMode.includes('Other')) {
                        include = true;
                        displayPar = item.parRnd;
                    }
                } else if (selectedRound === 'รายการทั้งหมด') {
                    include = true;
                    displayPar = item.parRnd || item.parDay || 0;
                }

                if (include) {
                    acc.push({ ...item, parLevel: displayPar });
                }
                
                return acc;
            }, []);
            
            if (selectedRound === 'รายการทั้งหมด') {
                currentItems.sort((a, b) => {
                    const getGroup = (supplier) => {
                        if (!supplier) return 4;
                        if (supplier.includes('Sainom')) return 1;
                        if (supplier.includes('Makro')) return 2;
                        if (supplier.includes('Other')) return 3;
                        return 4;
                    };
                    return getGroup(a.supplierMode) - getGroup(b.supplierMode);
                });
            }
            
            if (currentItems.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-slate-500 font-bold shadow-sm">
                        ยังไม่มีรายการสินค้าใน Station นี้<br>
                        <span class="text-xs font-normal">กรุณาเพิ่มรายการในระบบหลังบ้านก่อน</span>
                    </div>`;
                return;
            }

            let currentGroup = '';
            currentItems.forEach((item, index) => {
                if (selectedRound === 'รายการทั้งหมด') {
                    let group = 'รายการทั่วไป';
                    if (item.supplierMode && item.supplierMode.includes('Sainom')) group = 'Sainom';
                    else if (item.supplierMode && item.supplierMode.includes('Makro')) group = 'Makro';
                    else if (item.supplierMode && item.supplierMode.includes('Other')) group = 'ร้านอื่นๆ';

                    if (group !== currentGroup) {
                        currentGroup = group;
                        const headerHtml = `
                            <div class="mt-2 mb-4 flex items-center">
                                <div class="flex-1 border-t-2 border-indigo-100"></div>
                                <span class="px-4 text-[14px] font-bold text-indigo-500 tracking-wider">📦 ${group}</span>
                                <div class="flex-1 border-t-2 border-indigo-100"></div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', headerHtml);
                    }
                }

                const draftKey = selectedRound + '_' + selectedStation;
                let savedItem = null;
                if (savedDrafts[draftKey]) {
                    savedItem = savedDrafts[draftKey].items.find(i => i.itemName === item.itemName);
                }
                
                let defaultCount = savedItem ? savedItem.count : '';
                let defaultRemark = savedItem ? (savedItem.remark || '') : '';
                let defaultZeroStatus = savedItem ? (savedItem.zeroStatus || '') : '';
                
                let countValAttr = defaultCount !== '' ? `value="${defaultCount}"` : '';
                let remarkValAttr = defaultRemark !== '' ? `value="${defaultRemark}"` : '';
                let radioInContainer = defaultZeroStatus === 'in_container' ? 'checked' : '';
                let radioEmpty = defaultZeroStatus === 'empty' ? 'checked' : '';

                const html = `
                    <div class="card p-4">
                        <div class="flex justify-between items-start mb-3">
                            <div class="font-bold text-indigo-900 text-lg">${item.itemName}${item.unit ? ` <span class="text-slate-500 font-medium text-sm whitespace-nowrap">(${item.unit})</span>` : ''}</div>
                            <div class="text-xs text-slate-500 font-bold bg-slate-100 px-2 py-1 rounded-lg">ควรมี: <span class="text-indigo-600">${item.parLevel}</span></div>
                        </div>
                        
                        <div class="mb-3">
                            <input type="number" inputmode="decimal" step="any" id="count-${index}" ${countValAttr} class="w-full border border-slate-200 rounded-xl px-3 py-2.5 font-bold text-lg text-slate-800 placeholder:text-slate-300 placeholder:font-normal" placeholder="ยอดนับ">
                        </div>
                        
                        <div id="zero-choice-${index}" class="hidden mb-3 p-3 bg-amber-50 rounded-xl border border-amber-200">
                            <label class="block text-xs font-bold text-amber-800 mb-2">กรุณาระบุสถานะสินค้า:</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 text-sm text-amber-900 cursor-pointer">
                                    <input type="radio" name="zero-status-${index}" value="in_container" ${radioInContainer} onchange="checkRemarkRequirement(${index})" class="accent-amber-600"> ยังเหลือในภาชนะ
                                </label>
                                <label class="flex items-center gap-2 text-sm text-amber-900 cursor-pointer">
                                    <input type="radio" name="zero-status-${index}" value="empty" ${radioEmpty} onchange="checkRemarkRequirement(${index})" class="accent-amber-600"> ไม่เหลือเลย
                                </label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">หมายเหตุ <span class="text-rose-500" id="req-${index}"></span></label>
                            <input type="text" id="remark-${index}" ${remarkValAttr} class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 placeholder:text-slate-300 placeholder:font-normal" placeholder="กรอกหากมี">
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);

                // Add listener to count input to toggle required star on remark
                const countInput = document.getElementById(`count-${index}`);
                countInput.addEventListener('input', () => {
                    checkRemarkRequirement(index);
                });
            });

            // Add "Custom Item" button
            const addBtnHtml = `
                <button onclick="addCustomItem()" id="add-custom-btn" class="w-full py-3 mb-5 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 font-bold hover:bg-slate-50 hover:border-slate-400 transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                    เพิ่มรายการอื่นๆ (ถ้ามี)
                </button>
            `;
            container.insertAdjacentHTML('beforeend', addBtnHtml);

            // Initialize UI state based on pre-filled values
            currentItems.forEach((item, index) => {
                checkRemarkRequirement(index);
            });
        }

        function addCustomItem() {
            const index = currentItems.length;
            const item = {
                itemName: '',
                unit: '',
                parLevel: 0,
                isCustom: true,
                station: selectedStation
            };
            currentItems.push(item);

            const html = `
                <div class="card p-4 mb-4 border-dashed border-2 border-slate-300 bg-slate-50/50 relative" id="custom-card-${index}">
                    <button onclick="removeCustomItem(${index})" class="absolute top-3 right-3 text-slate-400 hover:text-rose-500 transition-colors bg-white rounded-full p-1 shadow-sm border border-slate-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>

                    <div class="mb-3 pr-8">
                        <label class="block text-xs font-bold text-slate-500 mb-1">ชื่อรายการ <span class="text-rose-500">*</span></label>
                        <input type="text" id="custom-name-${index}" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-indigo-900 font-bold" placeholder="เช่น น้ำตาลทราย..." required>
                    </div>
                    
                    <div class="mb-3">
                        <input type="number" inputmode="decimal" step="any" id="count-${index}" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 font-bold text-lg text-slate-800 placeholder:text-slate-300 placeholder:font-normal" placeholder="ยอดนับ" required>

                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 text-sm text-amber-900 cursor-pointer">
                                <input type="radio" name="zero-status-${index}" value="in_container" onchange="checkRemarkRequirement(${index})" class="accent-amber-600"> ยังเหลือในภาชนะ
                            </label>
                            <label class="flex items-center gap-2 text-sm text-amber-900 cursor-pointer">
                                <input type="radio" name="zero-status-${index}" value="empty" onchange="checkRemarkRequirement(${index})" class="accent-amber-600"> ไม่เหลือเลย
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">หมายเหตุ <span class="text-rose-500" id="req-${index}"></span></label>

                </div>
            `;

            const btn = document.getElementById('add-custom-btn');

        function removeCustomItem(index) {
            if (currentItems[index]) {
                currentItems[index].isDeleted = true;
            }
            const card = document.getElementById(`custom-card-${index}`);
            if (card) {
                card.remove();
            }
        }

        function checkRemarkRequirement(index) {
            const countVal = document.getElementById(`count-${index}`).value;
            const reqLabel = document.getElementById(`req-${index}`);
            const remarkInput = document.getElementById(`remark-${index}`);
            const zeroChoiceDiv = document.getElementById(`zero-choice-${index}`);
            
            const radios = document.getElementsByName(`zero-status-${index}`);
            let selectedRadio = null;
            radios.forEach(r => { if (r.checked) selectedRadio = r.value; });
            
            if (countVal === '0') {
                zeroChoiceDiv.classList.remove('hidden');
                
                if (selectedRadio === 'in_container') {
                    reqLabel.innerText = '*ระบุว่ามีในภาชนะหรือที่เตรียมไว้เท่าไหร่ หรือพอขายได้กี่เสิร์ฟโดยละเอียด หรือถ่ายรูปแจ้งส่งในกลุ่ม';
                    remarkInput.classList.add('border-amber-400', 'bg-amber-50/30');
                    remarkInput.placeholder = 'ระบุรายละเอียดเพิ่มเติม...';
                } else if (selectedRadio === 'empty') {
                    reqLabel.innerText = '';
                    remarkInput.classList.remove('border-amber-400', 'bg-amber-50/30');
                    remarkInput.placeholder = 'กรอกหากมี';
                } else {
                    reqLabel.innerText = '';
                    remarkInput.classList.remove('border-amber-400', 'bg-amber-50/30');
                    remarkInput.placeholder = 'กรอกหากมี';
                }
            } else {
                zeroChoiceDiv.classList.add('hidden');
                radios.forEach(r => r.checked = false);
                reqLabel.innerText = '';
                remarkInput.classList.remove('border-amber-400', 'bg-amber-50/30');
                remarkInput.placeholder = 'กรอกหากมี';
            }
        }

        function submitCount() {
            if (currentItems.length === 0) {
                Swal.fire('ไม่มีรายการ', 'ไม่มีสินค้าให้บันทึก', 'warning');
                return;
            }

            const dataToSave = [];
            let hasError = false;

            for (let i = 0; i < currentItems.length; i++) {
                const item = currentItems[i];
                if (item.isDeleted) continue;
                
                let itemName = item.itemName;

                if (item.isCustom) {
                    const customNameEl = document.getElementById(`custom-name-${i}`);
                    if (!customNameEl || !customNameEl.value.trim()) {
                        Swal.fire('ข้อมูลไม่ครบ', `กรุณาระบุชื่อรายการที่เพิ่มเข้ามาใหม่`, 'warning');
                        hasError = true;
                        break;
                    }
                    itemName = customNameEl.value.trim() + " (เพิ่มนอกรายการ)";
                }

                const countInput = document.getElementById(`count-${i}`).value;
                const remarkInput = document.getElementById(`remark-${i}`).value.trim();

                if (countInput === '') {
                    Swal.fire('ข้อมูลไม่ครบ', `กรุณาระบุยอดนับสำหรับ ${itemName}`, 'warning');
                    hasError = true;
                    break;
                }

                const countNum = parseFloat(countInput);
                if (countNum === 0) {
                    const radios = document.getElementsByName(`zero-status-${i}`);
                    let selectedRadio = null;
                    radios.forEach(r => { if (r.checked) selectedRadio = r.value; });
                    
                    if (!selectedRadio) {
                        Swal.fire('ข้อมูลไม่ครบ', `กรุณาระบุสถานะสินค้า (เหลือในภาชนะ/ไม่เหลือเลย) สำหรับ ${itemName}`, 'warning');
                        hasError = true;
                        break;
                    }
                    
                    if (selectedRadio === 'in_container' && remarkInput === '') {
                        Swal.fire('ข้อมูลไม่ครบ', `กรุณาระบุหมายเหตุสำหรับ ${itemName} (ระบุจำนวนที่เหลือ หรือแจ้งว่าถ่ายรูปลงกลุ่ม)`, 'warning');
                        document.getElementById(`remark-${i}`).focus();
                        hasError = true;
                        break;
                    }
                    
                    // If empty, we can just save it with empty remark, or prepend a flag
                    if (selectedRadio === 'empty' && remarkInput === '') {
                        // Acceptable, no action needed
                    }
                }

                dataToSave.push({
                    itemName: itemName,
                    unit: item.unit,
                    parLevel: item.parLevel,
                    supplier: item.supplierName || "",
                    count: countNum,
                    remark: remarkInput,
                    zeroStatus: countNum === 0 ? (() => {
                        const radios = document.getElementsByName(`zero-status-${i}`);
                        let sr = null;
                        radios.forEach(r => { if (r.checked) sr = r.value; });
                        return sr;
                    })() : null
                });
            }

            if (hasError) return;

            Swal.fire({
                title: 'ยืนยันการบันทึก?',
                text: "ตรวจสอบข้อมูลให้ถูกต้องก่อนบันทึก",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยัน',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    processSubmission(dataToSave);
                }
            });
        }

        function processSubmission(dataToSave) {
            showLoading('กำลังบันทึกข้อมูล...');

            const payload = {
                action: 'saveStockCount',
                timestamp: new Date().toISOString(),
                round: selectedRound,
                station: selectedStation,
                counterName: counterName,
                items: dataToSave
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                hideLoading();
                if (res.status === 'success') {
                    // Save to local draft
                    const draftKey = selectedRound + '_' + selectedStation;
                    savedDrafts[draftKey] = {
                        counterName: counterName,
                        items: dataToSave
                    };
                    localStorage.setItem('stock_drafts_' + todayStr, JSON.stringify(savedDrafts));
                    updateStationButtons();
                    
                    showSummary(dataToSave);
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', res.message, 'error');
                }
            })
            .catch(err => {
                hideLoading();
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + err.message, 'error');
            });
        }

        function showSummary(dataToSave) {
            document.getElementById('view-counting').classList.add('hidden');
            document.getElementById('view-summary').classList.remove('hidden');
            window.scrollTo(0,0);

            let summaryMsg = `นับ${selectedRound} (${selectedStation})\n`;
            summaryMsg += `ผู้ตรวจนับ: ${counterName}\n\n`;

            const lowStockItems = dataToSave.filter(item => item.count < item.parLevel || item.itemName.includes('(เพิ่มนอกรายการ)') || (item.remark && item.remark.trim() !== ''));
            
            if (lowStockItems.length === 0) {
                summaryMsg += `✅ สินค้าเพียงพอ ไม่มีหมายเหตุเพิ่มเติม`;
            } else {
                summaryMsg += `🛒 รายการขาด / มีหมายเหตุ:\n`;
                
                // Sort low stock items: 0 count items at the top
                lowStockItems.sort((a, b) => {
                    if (a.count === 0 && b.count !== 0) return -1;
                    if (b.count === 0 && a.count !== 0) return 1;
                    return 0;
                });

                lowStockItems.forEach((item, index) => {
                    let countText = item.count === 0 ? "เหลือ 0" : `เหลือ ${item.count}`;
                    if (item.unit && item.unit.trim() !== '') {
                        countText += ` ${item.unit}`;
                    }
                    
                    let remarkText = item.remark ? ` (${item.remark})` : '';
                    if (item.itemName.includes('(เพิ่มนอกรายการ)')) remarkText += ' (รายการนอกรอบ)';
                    
                    let cleanItemName = item.itemName.replace(' (เพิ่มนอกรายการ)', '');
                    
                    summaryMsg += `${index + 1}. ${cleanItemName}: ${countText}${remarkText}\n`;
                });
            }

            document.getElementById('summary-text-container').innerText = summaryMsg;
        }

        function copySummary() {
            const text = document.getElementById('summary-text-container').innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    Swal.fire({
                        icon: 'success',
                        title: 'คัดลอกสำเร็จ',
                        text: 'สามารถนำไปวางในกลุ่มไลน์ได้เลย',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }).catch(err => {
                    copyToClipboardFallback(text);
                });
            } else {
                copyToClipboardFallback(text);
            }
        }
        
        function copyToClipboardFallback(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                Swal.fire({
                    icon: 'success',
                    title: 'คัดลอกสำเร็จ',
                    text: 'สามารถนำไปวางในกลุ่มไลน์ได้เลย',
                    timer: 2000,
                    showConfirmButton: false
                });
            } catch (err) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถคัดลอกข้อความได้อัตโนมัติ กรุณาคัดลอกด้วยตนเอง', 'error');
            }
            document.body.removeChild(textArea);
        }

    </script>
</body>
</html>
